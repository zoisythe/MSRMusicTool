minimum_pre_commit_version: "4.6.1"
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: go-vet
        name: Go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
        types: [go]
      - id: conventional-commit
        name: Conventional Commit message
        entry: go run ./cmd/release-tool commit-message
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
