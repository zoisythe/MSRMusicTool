name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-standalone:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen --group standalone
      - run: uv run --no-sync python scripts/build_standalone.py
      - run: uv run --no-sync python scripts/verify_standalone.py
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ runner.os }}-${{ runner.arch }}
          path: release/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-standalone
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.1"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: release
          merge-multiple: true
      - run: uv build
      - name: Collect Python packages and checksums
        run: |
          cp dist/* release/
          cd release
          sha256sum msr-tool-* msrmusictool-* > SHA256SUMS
      - name: Create release
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "MSRMusicTool $GITHUB_REF_NAME"
          --generate-notes
          --latest
        env:
          GH_TOKEN: ${{ github.token }}
