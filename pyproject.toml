[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "MSRMusicTool"
version = "0.2.0"
description = "CLI and TUI music downloader for Monster Siren Records, with live progress and RPC."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MSRMusicTool contributors" }]
dependencies = [
  "httpx[socks]>=0.28,<1",
  "platformdirs>=4.3,<5",
  "rich>=15,<16",
  "textual>=1.0,<9",
]

[project.scripts]
msr-tool = "msr_music_tool.cli:main"

[dependency-groups]
dev = [
  "pre-commit>=4.6.1,<5",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]
standalone = [
  "pyinstaller>=6.21,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/msr_music_tool"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
  "integration: checks the live Monster Siren service without downloading audio",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["ASYNC240"]
